[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["Spincast Contributors"]
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
homepage = "https://github.com/carsonfarmer/spincast-factors"
repository = "https://github.com/carsonfarmer/spincast-factors"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1"
async-once-cell = "0.5.4"
async-trait = "0.1"
aws-config = { version = "1.1.7", default-features = false, features = [
  "rt-tokio",
  "credentials-process",
  "sso",
] }
aws-credential-types = "1.1.7"
futures = "0.3"
object_store = { version = "0.12", features = ["aws"] }
serde = { version = "1", features = ["derive", "rc"] }
tokio = "1"
toml = "0.8"
tracing = { version = "0.1.44", features = ["log"] }

# Spin's key-value factor seam, from upstream-equivalent main: this
# workspace needs nothing beyond what Spin already ships.
spin-core = { git = "https://github.com/carsonfarmer/spin", rev = "cd11d9217e143e8fa359096710f026c7e4f65608" }
spin-factor-key-value = { git = "https://github.com/carsonfarmer/spin", rev = "cd11d9217e143e8fa359096710f026c7e4f65608" }

[workspace.lints.clippy]
blocks_in_conditions = "allow"
