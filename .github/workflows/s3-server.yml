name: S3 server suite
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  minio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start MinIO
        run: |
          docker run -d --rm -p 9000:9000 --name minio \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          curl -sf -X PUT http://127.0.0.1:9000/spincast-test \
            --aws-sigv4 "aws:amz:us-east-1:s3" --user minioadmin:minioadmin
      - name: Run suite against MinIO
        env:
          SPINCAST_S3_TEST_BUCKET: spincast-test
          SPINCAST_S3_TEST_ENDPOINT: http://127.0.0.1:9000
          SPINCAST_S3_TEST_REGION: us-east-1
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        run: cargo test -p spin-key-value-s3 --test s3_server -- --test-threads=1
